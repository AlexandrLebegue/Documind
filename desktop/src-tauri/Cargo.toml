[package]
name = "documind-desktop"
version = "0.1.1"
description = "DocuMind desktop client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "documind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "5"

tokio = { version = "1", features = ["rt", "time"] }
tempfile = "3"
