[package]
name = "documind-agent"
version = "0.1.2"
edition = "2021"
description = "DocuMind folder synchronisation agent"

[[bin]]
name = "documind-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

wait-timeout = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
tempfile = "3"
