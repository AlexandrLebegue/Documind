name: Mobile

on:
  push:
    branches: [main]
    tags: ["v*-mobile"]
    paths:
      - "phone/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Release signing secrets required for publishing" >&2
            exit 1
          else
            echo "No signing secrets: using debug key for this validation build"
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release APKs per ABI
        run: flutter build apk --release --split-per-abi
      - name: Verify APK signatures
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$signer" verify --verbose --print-certs "$apk"
          done
      - name: Checksums
        run: |
          cd build/app/outputs/flutter-apk
          for apk in app*.apk; do
            mv "$apk" "${apk/app/documind-mobile-0.1.1}"
          done
          sha256sum *.apk > SHA256SUMS
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: documind-mobile-apk
          if-no-files-found: error
          path: |
            phone/build/app/outputs/flutter-apk/*.apk
            phone/build/app/outputs/flutter-apk/SHA256SUMS
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/release.jks

  ios:
    name: iOS (non signé)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry documind-mobile-0.1.1-unsigned.ipa Payload
          shasum -a 256 documind-mobile-0.1.1-unsigned.ipa > SHA256SUMS-ios
          ls -l
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: documind-mobile-ipa-unsigned
          if-no-files-found: error
          path: |
            phone/build/ipa/*.ipa
            phone/build/ipa/SHA256SUMS-ios

  release:
    name: Publish verified mobile release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: documind-mobile-*
          merge-multiple: true
          path: release
      - name: Verify and combine checksums
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS-ios
          test "$(find . -name '*.apk' | wc -l)" -eq 4
          test "$(find . -name '*.ipa' | wc -l)" -eq 1
          sha256sum *.apk *.ipa > SHA256SUMS
      - name: Publish mobile release
        uses: softprops/action-gh-release@v2
        with:
          name: DocuMind Mobile ${{ github.ref_name }}
          body: |
            Correctifs DocuMind Mobile 0.1.1 (Android et iPhone).

            - Envoi réparé pour fichier, galerie et scanner : le retour du sélecteur déclenche bien le POST.
            - Suivi immédiat des octets envoyés, file complète, position, OCR et analyse IA ; erreurs et réessai.
            - Badge global pour rouvrir le suivi sans interrompre les envois.
            - Chat : bouton retour en haut, clavier fermé au tap extérieur et au défilement.
            - Quatre APK signés avec la même clé release DocuMind que la version 0.1.0.
            - IPA non signée à signer avec Sideloadly/AltStore ; voir docs/IPHONE.md.
            - SHA256SUMS couvre les quatre APK et l’IPA. Serveur DocuMind accessible requis.
          files: |
            release/*.apk
            release/*.ipa
            release/SHA256SUMS
          fail_on_unmatched_files: true
