name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "frontend/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows (NSIS)
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: ubuntu-22.04
            label: Linux (AppImage + deb)
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            pkg-config

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build agent
        run: cargo build --release -p documind-agent --manifest-path desktop/Cargo.toml

      - name: Stage agent sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp desktop/target/release/documind-agent \
             desktop/src-tauri/binaries/documind-agent-${{ matrix.target }}

      - name: Stage agent sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp desktop/target/release/documind-agent.exe \
             desktop/src-tauri/binaries/documind-agent-${{ matrix.target }}.exe

      - name: Test desktop and agent before publication
        run: cargo test --workspace --manifest-path desktop/Cargo.toml

      - name: Windows service install, restart and SCM smoke test
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = (Resolve-Path desktop/target/release/documind-agent.exe).Path
          $config = Join-Path $env:RUNNER_TEMP 'documind-service-test.json'
          @{ server = 'http://127.0.0.1:8000'; folders = @($env:RUNNER_TEMP); enabled = $false; interval_minutes = 15; machine = 'ci-windows' } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM $config
          try {
            & $agent install --from $config
            if ($LASTEXITCODE -ne 0) { throw 'Service installation failed' }
            Start-Sleep -Seconds 2
            if ((Get-Service DocuMindAgent).Status -ne 'Running') { throw 'Service is not running in SCM' }
            & $agent install --from $config
            if ($LASTEXITCODE -ne 0) { throw 'Service reapplication/restart failed' }
            Start-Sleep -Seconds 2
            if ((Get-Service DocuMindAgent).Status -ne 'Running') { throw 'Service did not restart' }
            $applied = Get-Content "$env:ProgramData/DocuMind/agent.json" -Raw | ConvertFrom-Json
            if ($applied.server -ne 'http://127.0.0.1:8000' -or $applied.folders.Count -ne 1) { throw 'Applied config differs' }
            if (!(Test-Path "$env:ProgramData/DocuMind/logs/agent.log")) { throw 'Agent log missing' }
          } finally {
            & $agent uninstall
          }

      - name: Frontend regression tests
        working-directory: frontend
        run: npm test

      - name: Build Tauri app and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('DocuMind Desktop {0}', github.ref_name) || '' }}
          releaseBody: |
            Client PC DocuMind (Tauri 2) et agent de synchronisation de dossiers.

            - Windows : installeur NSIS, inclut `documind-agent.exe`
            - Linux : `.AppImage` et `.deb`
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Upload workflow artifacts (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: documind-desktop-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/deb/*.deb
